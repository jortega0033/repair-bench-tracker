[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repair-bench-tracker"
version = "0.0.0"
description = "Offline repair desk: scaffold only, no product behaviour yet."
requires-python = ">=3.12"
dependencies = []
license = { text = "MIT" }

[project.scripts]
repair-bench = "repair_bench.__main__:main"

[tool.setuptools]
packages = ["repair_bench"]

[tool.setuptools.package-data]
repair_bench = ["static/*"]
